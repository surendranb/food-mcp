[project]
name = "food-mcp"
version = "0.1.0"
description = "Precision food chemistry, global nutrition databases (USDA, Open Food Facts, IFCT), and recipe formulation for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Surendran B", email = "reachsuren@gmail.com" }]
keywords = [
  "mcp",
  "fastmcp",
  "food-chemistry",
  "nutrition",
  "recipe-formulation",
  "ifct",
  "usda",
  "openfoodfacts",
  "amino-acids",
  "leucine",
  "glycemic-load",
  "nova-score",
  "agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "mcp>=2.0.0,<3",
  "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
publish = [
  "build>=1.2.2",
  "twine>=5.1.1",
]

[project.urls]
Homepage = "https://github.com/surendranb/food-mcp"
Repository = "https://github.com/surendranb/food-mcp"
Issues = "https://github.com/surendranb/food-mcp/issues"

[project.scripts]
food-mcp = "food_mcp.server:main"
food-chemistry-mcp = "food_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
food_mcp = ["skills/*.md", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
